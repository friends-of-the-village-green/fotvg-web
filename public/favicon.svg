<!--
  FotVG browser-tab icon.

  The board decided against a logo or emblem — the site's identity is the
  organization's name set in type, and the header reflects that. A browser tab
  still needs something, so this is the wordmark reduced to the smallest thing
  that stays recognizable: the abbreviation, in the site's serif, brass on the
  deep forest green of the hero band.

  Set on two lines because a favicon is often painted at 16 pixels and five
  characters on one line at that size is a smudge. Two short lines keep the
  strokes thick enough to read.

  This file is the source. favicon.ico and apple-touch-icon.png are generated
  from it — if you change this, regenerate those too, or the tab and the iOS
  home-screen icon will disagree with each other.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FotVG">
  <rect width="64" height="64" rx="10" fill="#123328"/>
  <text x="32" y="29" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="23" font-weight="600" fill="#d9b65f">Fot</text>
  <text x="32" y="53" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="25" font-weight="600" fill="#d9b65f">VG</text>
</svg>
